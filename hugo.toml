baseURL = 'https://blog.opencommonplace.com/'
languageCode = 'en-us'
title = 'Open Commonplace'
theme = 'PaperMod'

pagination.pagerSize = 8

[params]
  env = "production"
  description = "Book notes, summaries, and key takeaways from the community of readers."
  keywords = ["book notes", "summaries", "key takeaways", "commonplace", "reading"]
  author = "Open Commonplace"
  defaultTheme = "auto"
  disableThemeToggle = false

  # Post features
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  disableSpecial1stPost = false

  # Homepage intro
  [params.homeInfoParams]
    Title = "Open Commonplace"
    Content = """
A shared digital commonplace book.

Discover insights, key takeaways, and notes from books — contributed by a community of readers.
"""

  # Social icons (update the URLs with real ones later)
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/shayeqkhan01/opencommonplace-blog"

  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/opencommonplace"