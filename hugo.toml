baseURL = 'https://blog.opencommonplace.com/'
languageCode = 'en-us'
title = 'Open Commonplace'
theme = 'PaperMod'

pagination.pagerSize = 8

[params]
  env = "production"
  description = "Book notes, summaries, and key takeaways from the community of readers."
  keywords = ["book notes", "summaries", "key takeaways", "commonplace", "reading"]
  author = "Open Commonplace"
  defaultTheme = "light"
  disableThemeToggle = true
  homeTitle = "Ideas for a more thoughtful life."
  homeDescription = "A living archive of book notes, mental models, and useful questions, gathered in public."
  [params.label]
    text = "Open Commonplace"

  # Post features
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  disableSpecial1stPost = false

  # Homepage intro
  [params.homeInfoParams]

  # Social icons (update the URLs with real ones later)
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/shayeqkhan01/opencommonplace-blog"

  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/opencommonplace"

[[menu.main]]
  name = "Notes"
  url = "/blog/"
  weight = 10

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 20