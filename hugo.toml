baseURL = 'https://blog.opencommonplace.com/'
languageCode = 'en-us'
title = 'Open Commonplace'
theme = 'PaperMod'

pagination.pagerSize = 8

[params]
  env = "production"
  description = "Book notes, summaries, and key takeaways from the community of readers."
  keywords = ["book notes", "summaries", "key takeaways", "commonplace", "reading"]
  author = "Open Commonplace Blog"
  defaultTheme = "light"
  disableThemeToggle = true
  homeTitle = "Ideas for a more thoughtful life."
  homeDescription = "A repository of practical human wisdom—built from authentic reader notes, not AI summaries."
  [params.assets]
    favicon = "favicon.ico"
    favicon16x16 = "favicon-16x16.png"
    favicon32x32 = "favicon-32x32.png"
    apple_touch_icon = "apple-touch-icon.png"
    safari_pinned_tab = "safari-pinned-tab.svg"

  [params.label]
    text = "Open Commonplace Blog"
    icon = "images/logo.svg"
    iconHeight = 32

  # Post features
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  disableSpecial1stPost = true

  # Homepage intro
  [params.homeInfoParams]

  # Social icons (update the URLs with real ones later)
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/shayeqkhan01/opencommonplace-blog"

  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/opencommonplace"

[[menu.main]]
  name = "Open Commonplace"
  url = "https://opencommonplace.com"
  weight = 20