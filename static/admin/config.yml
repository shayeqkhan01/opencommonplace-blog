backend:
  name: github
  repo: "shayeqkhan01/opencommonplace-blog"
  branch: main
  base_url: "https://auth.opencommonplace.com"
  auth_endpoint: "auth"

local_backend: true

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Blog"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - label: Title
        name: title
        widget: string

      - label: Date
        name: date
        widget: datetime
        format: "YYYY-MM-DDTHH:mm:ssZ"

      - label: Description
        name: description
        widget: text
        required: false

      - label: Category
        name: category
        widget: string
        required: false

      - label: Featured on Homepage
        name: featured
        widget: boolean
        default: false
        required: false

      - label: Featured Image
        name: image
        widget: image
        required: false

      - label: Image Alt Text
        name: image_alt
        widget: string
        required: false

      - label: Body
        name: body
        widget: markdown